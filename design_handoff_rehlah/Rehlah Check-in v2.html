<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rehlah · Daily Check-in v2 — phase-aware redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rehlah-styles.css">
</head>
<body>

<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="oklch(0.965 0.010 75)"/>
    <rect x="60" y="40" width="80" height="120" rx="16" fill="oklch(0.380 0.060 195)"/>
    <text x="100" y="115" font-family="Tajawal, serif" font-size="56" fill="oklch(0.760 0.130 75)" text-anchor="middle">ر</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens-checkin-v2.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const W = 402, H = 874;

function App() {
  const ab = (id, label, Screen, props = {}) =>
    React.createElement(DCArtboard, { id, label, width: W, height: H, key: id },
      React.createElement(IOSDevice, { width: W, height: H },
        React.createElement(Screen, props)));

  return (
    <DesignCanvas
      title="Rehlah · Daily Check-in v2"
      subtitle="The phase-aware single-screen check-in from Rehlah_Checkin_Redesign_v1.0.md, drawn in the v0.1 design system. Mood likert (5 abstract faces) · 5-point segmented severity with verbal anchors · phase-aware symptom set · fever red-flag escalation during nadir · manual-dismiss success with trend. Bilingual."
    >
      <DCSection id="en" title="English (LTR)">
        {ab("treatment", "Treatment day (Day 1)", CheckinTreatmentScreen, { lang: "en" })}
        {ab("nadir", "Nadir window (Day 9)", CheckinNadirScreen, { lang: "en", fever: false })}
        {ab("nadir-fever", "Nadir + fever ≥ 38°C", CheckinNadirScreen, { lang: "en", fever: true })}
        {ab("recovery", "Recovery (Day 17)", CheckinRecoveryScreen, { lang: "en" })}
        {ab("success", "Success + trend", CheckinSuccessV2Screen, { lang: "en" })}
      </DCSection>

      <DCSection id="ar" title="عربي (RTL)">
        {ab("nadir-ar", "فترة الهبوط المناعي", CheckinNadirScreen, { lang: "ar", fever: false })}
        {ab("nadir-fever-ar", "تنبيه حرارة", CheckinNadirScreen, { lang: "ar", fever: true })}
        {ab("success-ar", "تم التسجيل + مقارنة", CheckinSuccessV2Screen, { lang: "ar" })}
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
